[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twitter-cli"
version = "0.8.6"
description = "A CLI for Twitter/X — feed, bookmarks, and user timeline in terminal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "jackwener", email = "jakevingoo@gmail.com" }]
keywords = ["twitter", "x", "cli", "feed", "timeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "browser-cookie3>=0.20.1",
    "click>=8.4.2",
    "rich>=15.0.0",
    "PyYAML>=6.0",
    "curl_cffi>=0.16.1",
    "xclienttransaction>=1.0.3",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260815",
]

[project.urls]
Homepage = "https://github.com/ain3sh/twitter-cli"
Repository = "https://github.com/ain3sh/twitter-cli"
Issues = "https://github.com/ain3sh/twitter-cli/issues"

[project.scripts]
twitter = "twitter_cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: real-API integration tests (run with: pytest -m smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.hatch.build.targets.wheel]
packages = ["twitter_cli"]
